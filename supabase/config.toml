project_id = "pitgo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/private/validate_account_signup"

[functions.geocode-provider-address]
verify_jwt = true

[functions.refresh-provider-geocodes]
verify_jwt = false

[functions.pittec-route]
verify_jwt = true

[functions.mp-create-payment]
verify_jwt = true

[functions.mp-save-card]
verify_jwt = true

[functions.mp-remove-card]
verify_jwt = true

[functions.mp-refund-payment]
verify_jwt = true

[functions.mp-cancel-payment]
verify_jwt = true

# Called by Mercado Pago itself (no user session); authenticity is verified inside the
# function via the MP_WEBHOOK_SECRET signature instead of a Supabase JWT.
[functions.mp-webhook]
verify_jwt = false

# Dedicated Vault-backed secret; a user JWT does not authorize this worker.
[functions.mp-reconcile-payments]
verify_jwt = false
